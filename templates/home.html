<!DOCTYPE html>
<html>

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Forest Fire Weather Index Prediction</title>


    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }


        /* =========================
           BODY / FOREST BACKGROUND
           ========================= */

        body {

            min-height: 100vh;

            display: flex;

            justify-content: center;

            align-items: center;

            padding: 30px 15px;

            position: relative;

            overflow-x: hidden;


            /* Forest Background */

            background-image:

                linear-gradient(
                    135deg,
                    rgba(3, 18, 10, 0.92),
                    rgba(8, 50, 25, 0.72),
                    rgba(120, 35, 8, 0.65)
                ),

                url("https://images.unsplash.com/photo-1448375240586-882707db888b?auto=format&fit=crop&w=2000&q=90");


            background-size: cover;

            background-position: center;

            background-attachment: fixed;

        }


        /* Dark overlay */

        body::before {

            content: "";

            position: fixed;

            top: 0;

            left: 0;

            width: 100%;

            height: 100%;

            pointer-events: none;

            background:

                radial-gradient(
                    circle at 20% 20%,
                    rgba(255, 140, 0, 0.15),
                    transparent 30%
                ),

                radial-gradient(
                    circle at 80% 80%,
                    rgba(255, 50, 0, 0.18),
                    transparent 35%
                );

            z-index: 0;
        }


        /* =========================
           FLOATING FIRE GLOW
           ========================= */

        body::after {

            content: "";

            position: fixed;

            width: 500px;

            height: 500px;

            right: -200px;

            bottom: -250px;

            border-radius: 50%;

            background: rgba(255, 90, 0, 0.20);

            filter: blur(80px);

            pointer-events: none;

            animation: fireGlow 4s infinite alternate;

            z-index: 0;
        }


        @keyframes fireGlow {

            from {
                transform: scale(1);
                opacity: 0.4;
            }

            to {
                transform: scale(1.25);
                opacity: 0.8;
            }

        }


        /* =========================
           MAIN CARD
           ========================= */

        .login {

            position: relative;

            z-index: 2;

            width: 95%;

            max-width: 520px;

            padding: 35px;

            border-radius: 25px;


            /* Glass effect */

            background: rgba(255, 255, 255, 0.93);

            backdrop-filter: blur(18px);

            -webkit-backdrop-filter: blur(18px);


            border: 1px solid rgba(255, 255, 255, 0.5);


            box-shadow:

                0 25px 60px rgba(0, 0, 0, 0.45),

                0 0 40px rgba(255, 100, 0, 0.15);


            text-align: center;


            animation: cardEntry 0.9s ease;

        }


        @keyframes cardEntry {

            from {

                opacity: 0;

                transform:
                    translateY(40px)
                    scale(0.95);

            }

            to {

                opacity: 1;

                transform:
                    translateY(0)
                    scale(1);

            }

        }


        /* =========================
           TITLE
           ========================= */

        .login h1 {

            margin-bottom: 12px;

            color: #16351f;

            font-size: 29px;

            line-height: 1.25;

            font-weight: 800;

        }


        /* Fire icon */

        .login h1::before {

            content: "🔥";

            display: block;

            font-size: 42px;

            margin-bottom: 8px;

            animation: flame 1.5s infinite alternate;

        }


        @keyframes flame {

            from {
                transform: scale(1);
            }

            to {
                transform: scale(1.12);
            }

        }


        /* Subtitle */

        .login::before {

            content:
                "Predict Forest Fire Risk using Weather Conditions";

            display: block;

            margin-bottom: 22px;

            color: #64748b;

            font-size: 14px;

            font-weight: 500;

        }


        /* =========================
           INPUT FIELDS
           ========================= */

        input {

            width: 100%;

            padding: 14px 16px;

            margin: 7px 0;

            border: 2px solid #dce4df;

            border-radius: 12px;

            background: rgba(248, 250, 249, 0.95);

            color: #1f2937;

            font-size: 15px;

            transition: all 0.3s ease;

        }


        input::placeholder {

            color: #87928b;

        }


        /* Input hover */

        input:hover {

            border-color: #79a87f;

            background: white;

        }


        /* Input focus */

        input:focus {

            outline: none;

            border-color: #218739;

            background: white;


            box-shadow:

                0 0 0 4px rgba(33, 135, 57, 0.12);

            transform: translateY(-2px);

        }


        /* =========================
           PREDICT BUTTON
           ========================= */

        button {

            width: 100%;

            padding: 15px;

            margin-top: 20px;

            border: none;

            border-radius: 12px;


            background:

                linear-gradient(
                    135deg,
                    #176b2c,
                    #269d3c,
                    #f05a17
                );


            background-size: 200% 200%;


            color: white;

            font-size: 17px;

            font-weight: bold;

            letter-spacing: 0.5px;

            cursor: pointer;


            box-shadow:

                0 8px 20px
                rgba(22, 100, 40, 0.35);


            transition: all 0.35s ease;

        }


        /* Button hover */

        button:hover {

            background-position: right center;

            transform: translateY(-3px);

            box-shadow:

                0 12px 28px
                rgba(210, 70, 10, 0.4);

        }


        button:active {

            transform: translateY(0);

        }


        /* =========================
           RESULT BOX
           ========================= */

        .result {

            margin-top: 25px;

            padding: 17px;

            border-radius: 13px;


            background:

                linear-gradient(
                    135deg,
                    #e8f8ec,
                    #fff4e6
                );


            color: #176b2c;

            font-size: 20px;

            font-weight: bold;


            border-left:

                5px solid #f05a17;


            box-shadow:

                0 6px 18px
                rgba(0, 0, 0, 0.08);


            animation: resultAppear 0.6s ease;

        }


        @keyframes resultAppear {

            from {

                opacity: 0;

                transform: scale(0.95);

            }

            to {

                opacity: 1;

                transform: scale(1);

            }

        }


        /* =========================
           DESKTOP DECORATION
           ========================= */

        .login form {

            position: relative;

        }


        /* =========================
           MOBILE RESPONSIVE
           ========================= */

        @media (max-width: 600px) {

            body {

                padding: 20px 10px;

                background-attachment: scroll;

            }


            .login {

                width: 100%;

                padding: 25px 20px;

                border-radius: 20px;

            }


            .login h1 {

                font-size: 23px;

            }


            .login h1::before {

                font-size: 35px;

            }


            input {

                padding: 12px 13px;

                font-size: 14px;

            }


            button {

                padding: 13px;

                font-size: 15px;

            }


            .result {

                font-size: 17px;

            }

        }


        /* =========================
           SMALL MOBILE
           ========================= */

        @media (max-width: 380px) {

            .login {

                padding: 22px 16px;

            }


            .login h1 {

                font-size: 20px;

            }


            .login h1::before {

                font-size: 30px;

            }

        }

    </style>

</head>


<body>


    <div class="login">


        <h1>
            Forest Fire Weather Index Prediction
        </h1>


        <!-- Main Input For Receiving Query To Our ML -->

        <form action="/" method="post">


            <input
                type="text"
                name="Temperature"
                placeholder="🌡️ Temperature"
                required="required"
            />

            <br>


            <input
                type="text"
                name="RH"
                placeholder="💧 Relative Humidity (RH)"
                required="required"
            />

            <br>


            <input
                type="text"
                name="Ws"
                placeholder="💨 Wind Speed (Ws)"
                required="required"
            />

            <br>


            <input
                type="text"
                name="Rain"
                placeholder="🌧️ Rain"
                required="required"
            />

            <br>


            <input
                type="text"
                name="FFMC"
                placeholder="🔥 FFMC"
                required="required"
            />

            <br>


            <input
                type="text"
                name="DMC"
                placeholder="🌲 DMC"
                required="required"
            />

            <br>


            <input
                type="text"
                name="ISI"
                placeholder="🔥 ISI"
                required="required"
            />

            <br>


            <input
                type="text"
                name="Classes"
                placeholder="📊 Classes"
                required="required"
            />

            <br>


            <input
                type="text"
                name="Region"
                placeholder="📍 Region"
                required="required"
            />

            <br>


            <button
                type="submit"
                class="btn btn-primary btn-block btn-large"
            >

                🔥 Predict FWI

            </button>


        </form>


        <div class="result">

            The FWI prediction is {{results}}

        </div>


    </div>


</body>

</html>
